<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#B5401F" />
  <title>ChopChop — Food Delivery Across Africa</title>
  <meta name="description" content="Order jollof, suya, injera, nyama choma and more from the best kitchens across Africa. Pay with mobile money." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="app" id="app">
    <header class="topbar">
      <button class="city-picker" id="cityPicker" aria-haspopup="dialog" aria-label="Change delivery city">
        <span class="city-picker__label">Delivering to</span>
        <span class="city-picker__value"><span id="cityFlag"></span> <span id="cityName"></span>
          <svg width="14" height="14" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 9l6 6 6-6" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </span>
      </button>
      <a class="brand" href="#/" aria-label="ChopChop home">
        <span class="brand__mark" aria-hidden="true"></span>ChopChop
      </a>
    </header>

    <main id="view" class="view" tabindex="-1"></main>

    <a href="#/cart" class="cart-bar" id="cartBar" hidden>
      <span class="cart-bar__count" id="cartBarCount">0</span>
      <span>View basket</span>
      <span class="cart-bar__total" id="cartBarTotal"></span>
    </a>

    <nav class="tabbar" aria-label="Main">
      <a href="#/" data-tab="home"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>Home</a>
      <a href="#/search" data-tab="search"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>Search</a>
      <a href="#/orders" data-tab="orders"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 4h14l-1 16H6z"/><path d="M9 8a3 3 0 0 0 6 0"/></svg>Orders</a>
      <a href="#/cart" data-tab="cart"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 4h2l2.4 11.2a2 2 0 0 0 2 1.6h7.7a2 2 0 0 0 2-1.5L21 8H6"/><circle cx="10" cy="20" r="1.4"/><circle cx="17" cy="20" r="1.4"/></svg>Basket<span class="tab-badge" id="tabBadge" hidden></span></a>
    </nav>
  </div>

  <dialog class="sheet" id="citySheet" aria-labelledby="citySheetTitle">
    <div class="sheet__handle" aria-hidden="true"></div>
    <h2 id="citySheetTitle">Where should we deliver?</h2>
    <p class="muted">Prices are shown in your local currency.</p>
    <div class="city-grid" id="cityGrid"></div>
  </dialog>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
